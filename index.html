      if(r.error){failed=true;console.warn(r.error);}else cloud.saved[key]=j;
    }
    for(const key of Object.keys(cloud.known)){
      const id=key.slice(2),gone=key[0]==='c'?!chars.some(x=>x.id===id):!camps.some(x=>x.id===id);
      if(!gone)continue;wrote=true;
      const r=await sb.from(key[0]==='c'?'characters':'campaigns').delete().eq('id',id);
      if(r.error)failed=true;else{delete cloud.known[key];delete cloud.saved[key];}
    }
    S.sync=failed?'err':'ok';
  }catch(e){console.warn(e);S.sync='err';failed=true;}
  cloud.busy=false;
  if(failed)cloud.timer=setTimeout(flush,5000);
  if(wrote)softRender();
}
async function dbCreateCamp(c,pw,email){
  try{
    const d=strip(c);
    let r=await sb.from('campaigns').insert({id:c.id,code:c.code,name:c.name,dm_id:S.user.uid,dm_name:c.dm,dm_email:email,dm_pw_hash:'pending',data:d});
    if(r.error)throw r.error;
    r=await sb.rpc('set_dm_password',{camp:c.id,pw,email});if(r.error)throw r.error;
    cloud.known['k:'+c.id]=1;cloud.saved['k:'+c.id]=canon(d);delete c.pw;S.sync='ok';
  }catch(e){console.warn(e);S.sync='err';toast('Could not save the campaign online. Check your connection.');}
  softRender();
}
function softRender(){
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest&&a.closest('#app,#modal')){clearTimeout(cloud.soft);cloud.soft=setTimeout(softRender,1500);return;}
  render(true);
}
function applyRemote(table,type,row,old){
  const isC=table==='characters',arr=isC?chars:camps,key=(isC?'c:':'k:');
  if(type==='DELETE'){
    const id=old&&old.id;if(!id)return;const i=arr.findIndex(x=>x.id===id);
    if(i>=0){arr.splice(i,1);delete cloud.known[key+id];delete cloud.saved[key+id];
      if(!isC&&S.campId===id){S.screen='campaigns';S.campId=null;S.role=null;toast('That campaign was deleted.');}softRender();}
    return;
  }
  const d=row.data;if(!d)return;
  if(!isC){d.id=row.id;d.code=row.code;d.name=row.name;d.dm=row.dm_name;fixCamp(d);}
  const k=key+(isC?d.id:row.id),i=arr.findIndex(x=>x.id===(isC?d.id:row.id)),cj=canon(isC?d:strip(d));
  if(cloud.saved[k]===cj)return;
  if(i>=0){const local=canon(isC?arr[i]:strip(arr[i]));if(local!==cloud.saved[k])return;arr[i]=d;}else arr.push(d);
  cloud.saved[k]=cj;cloud.known[k]=1;softRender();
}
function subscribe(){
  if(cloud.chan)sb.removeChannel(cloud.chan);
  cloud.chan=sb.channel('chronicle').on('postgres_changes',{event:'*',schema:'public',table:'characters'},p=>applyRemote('characters',p.eventType,p.new,p.old))
    .on('postgres_changes',{event:'*',schema:'public',table:'campaigns'},p=>applyRemote('campaigns',p.eventType,p.new,p.old)).subscribe();
}
async function startSession(user,fallbackName){
  const uid=user.id;
  let name=fallbackName;
  const pr=await sb.from('profiles').select('name').eq('id',uid).maybeSingle();
  if(pr.data&&pr.data.name)name=pr.data.name;
  else if(name){await sb.from('profiles').upsert({id:uid,name});}
  if(!name)name=(user.email||'Player').split('@')[0];
  S.user={name,guest:!!user.is_anonymous,uid};
  try{const op=JSON.parse(localStorage.getItem('chronicle-offline-play:'+uid)||'{}');S.offlinePlay=op;}catch(e){S.offlinePlay={};}
  await loadAll();subscribe();S.sync='ok';S.screen='campaigns';
  try{localStorage.setItem('chronicle-last-user',uid);}catch(e){}
}
async function boot(){
  if(!(await reachable())){
    let uid='';try{uid=localStorage.getItem('chronicle-last-user')||'';}catch(e){}
    const cached=uid?await offlineGet(uid):null;
    if(cached&&cached.user&&cached.chars){S.user=cached.user;chars.splice(0,chars.length,...cached.chars);camps.length=0;S.offlinePlay=cached.offlinePlay||{};S.online=false;S.screen='characters';S.charTab='offline';S.booting=false;render();return;}
    S.booting=false;S.fatal='You need to open The Chronicle online once before using Offline Play on this device.';render();return;
  }
  if(typeof window.supabase==='undefined'){S.booting=false;S.fatal='The connection library did not load. Check your internet and try again.';render();return;}
  try{
    sb=window.supabase.createClient(SB_URL,SB_KEY);S.online=true;
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await startSession(data.session.user);
    else{S.user=null;}
  }catch(e){console.warn(e);S.user=null;S.authErr='Could not load your data. Try again.';}
  S.booting=false;render();
}
async function cloudAuth(){
  const m=S.authMode,nm=val('a-name'),em=val('a-email'),pw=val('a-pass');
  S.authErr='';
  try{
    if(m==='guest'){
      if(!nm){S.authErr='Pick a display name first.';return;}
      const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;
      await startSession(r.data.user,nm);
    }else{
      if(!em||!pw){S.authErr='Enter your email and a password.';return;}
      if(m==='signup'){
        if(!nm){S.authErr='Pick a display name.';return;}
        if(pw.length<6){S.authErr='Use at least 6 characters for the password.';return;}
        const r=await sb.auth.signUp({email:em,password:pw});if(r.error)throw r.error;
        if(!r.data.session){S.authErr='Account created. Check your email to confirm it, then sign in.';S.authMode='signin';return;}
        await startSession(r.data.user,nm);
      }else{
        const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;
        await startSession(r.data.user,'');
      }
    }
  }catch(e){S.user=null;S.authErr=e&&e.message?e.message:'Something went wrong.';}
  finally{S.authBusy=false;render();}
}

camps.forEach(fixCamp);
window.addEventListener('online',()=>{if(S.user){persistOfflinePlay();setTimeout(()=>{if(navigator.onLine)location.reload();},700);}});
if(DEMO){S.booting=false;render();}else{S.booting=true;render();boot();}
})();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}catch(e){}
</script>
